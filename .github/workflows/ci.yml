name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "VERSION"
      - "docs/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check index.json is up-to-date
        run: |
          python tools/generate_index.py
          git diff --exit-code templates/index.json || {
            echo "::error::templates/index.json is stale. Run 'python tools/generate_index.py' and commit the result."
            exit 1
          }

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - run: flutter test
        working-directory: mobile
