name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "VERSION"
      - "docs/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - run: flutter test
        working-directory: mobile
