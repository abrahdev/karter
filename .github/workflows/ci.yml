name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "VERSION"
      - "docs/**"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate template resolution + catalog build
        run: python templates/tools/build_catalog.py --check-only

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - run: flutter test
        working-directory: mobile
