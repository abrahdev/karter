name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - run: flutter test
        working-directory: mobile

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          echo "storeFile=/tmp/upload-keystore.jks" > mobile/android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> mobile/android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> mobile/android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> mobile/android/key.properties

      - run: flutter build apk --release --build-name=$(cat ../VERSION)
        working-directory: mobile

      - name: Rename APK
        run: |
          VERSION=$(cat VERSION)
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             "karter-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: karter-*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev pkg-config

      - run: flutter pub get
        working-directory: mobile

      - run: flutter build linux --release
        working-directory: mobile

      - name: Package Linux bundle
        run: |
          VERSION=$(cat VERSION)
          cd mobile/build/linux/x64/release
          tar czf "${GITHUB_WORKSPACE}/karter-${VERSION}-linux-x64.tar.gz" bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: karter-linux-x64
          path: karter-*-linux-x64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - uses: actions/download-artifact@v4
        with:
          name: karter-linux-x64

      - name: Create GitHub Release
        run: |
          VERSION=$(cat VERSION)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            karter-*.apk \
            karter-*-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
