name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python templates/tools/build_catalog.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile

      - run: flutter test
        working-directory: mobile

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          echo "storeFile=/tmp/upload-keystore.jks" > mobile/android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> mobile/android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> mobile/android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> mobile/android/key.properties

      - run: flutter build apk --release --build-name=$(cat ../VERSION)
        working-directory: mobile

      - name: Rename APK
        run: |
          VERSION=$(cat VERSION)
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             "karter-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: karter-*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python templates/tools/build_catalog.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev pkg-config libsecret-1-dev

      - run: flutter pub get
        working-directory: mobile

      - run: flutter build linux --release
        working-directory: mobile

      - name: Package Linux bundle
        run: |
          VERSION=$(cat VERSION)
          cd mobile/build/linux/x64/release
          tar czf "${GITHUB_WORKSPACE}/karter-${VERSION}-linux-x64.tar.gz" bundle/

      - uses: actions/upload-artifact@v7
        with:
          name: karter-linux-x64
          path: karter-*-linux-x64.tar.gz

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime
        run: |
          flatpak install --user -y --noninteractive \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk.Extension.llvm22//25.08

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=flatpak/repo \
            flatpak/build flatpak/dev.abrah.karter.yml

      - name: Create Flatpak bundle
        run: |
          VERSION=$(cat VERSION)
          flatpak build-bundle \
            flatpak/repo "karter-${VERSION}-x86_64.flatpak" \
            dev.abrah.karter

      - uses: actions/upload-artifact@v7
        with:
          name: karter-flatpak
          path: karter-*.flatpak

  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-flatpak]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-release-apk

      - uses: actions/download-artifact@v8
        with:
          name: karter-linux-x64

      - uses: actions/download-artifact@v8
        with:
          name: karter-flatpak

      - name: Create GitHub Release
        run: |
          VERSION=$(cat VERSION)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            karter-*.apk \
            karter-*-linux-x64.tar.gz \
            karter-*.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
