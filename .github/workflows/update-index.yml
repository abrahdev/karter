name: Update template index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/**/*.json'
      - 'templates/tools/generate_index/generate_index.py'
      - 'templates/tools/build_catalog/build_catalog.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install template tooling deps
        run: pip install -r templates/tools/requirements.txt

      - name: Regenerate index.json
        run: python templates/tools/generate_index/generate_index.py

      - name: Build catalog db
        run: python templates/tools/build_catalog/build_catalog.py --schema-check

      - name: Commit and open pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/index.json templates/karter-catalog.db
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          branch="chore/update-template-index"
          git checkout -b "$branch"
          git commit -m "chore(templates): regenerate index.json and karter-catalog.db"
          git push --force origin "$branch"

          if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            echo "PR already exists; pushing updated branch"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(templates): regenerate index.json and karter-catalog.db" \
              --body "Automated catalog refresh (template data changed on main)."
          fi

      - name: Publish catalog to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog >/dev/null 2>&1 || \
            gh release create catalog --title "Template catalog" --notes "Rolling catalog build refreshed on every templates change."
          gh release upload catalog templates/karter-catalog.db --clobber
