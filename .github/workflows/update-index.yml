name: Update template index

on:
  push:
    branches: [main]
    paths:
      - 'templates/**/*.json'
      - 'tools/generate_index.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate index.json
        run: python tools/generate_index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/index.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: regenerate templates/index.json" && git push)
