id: dev.abrah.karter
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: karter

finish-args:
  # Networking: catalog database download + Google Drive backup/cloud sync.
  - --share=network
  - --share=ipc
  # GTK windowing: X11 and Wayland.
  - --socket=x11
  - --socket=wayland
  # Graphics/GPU rendering.
  - --device=dri
  # App data is stored under Documents via path_provider.
  - --filesystem=xdg-documents
  # Notification permission (flutter_local_notifications).
  - --talk-name=org.freedesktop.Notifications
  # D-Bus portal access for file dialogs / secure storage.
  - --talk-name=org.freedesktop.portal.*
  - --system-talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.secrets

# The Flutter SDK and its pub cache are only needed to compile the app; remove
# them from the exported app so only the self-contained release bundle remains.
cleanup:
  - /lib/flutter

modules:
  - name: flutter
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/flutter
      - cp -a bin /app/lib/flutter/
      - cp -a packages /app/lib/flutter/
      - cp -a .git* /app/lib/flutter/ || true
    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.4-stable.tar.xz
        sha256: c853cda0312a162854c481fe6a1bc286d84fbb74bfab7037c39750061dc9b466

  - name: karter
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      build-args:
        - --share=network
      env:
        PATH: /app/lib/flutter/bin:/usr/bin:/bin
        PUB_CACHE: /app/lib/flutter/.pub-cache
    build-commands:
      - mkdir -p "$PUB_CACHE"
      - flutter config --no-analytics
      # Drop any locally generated build artifacts copied in via the source,
      # their CMake cache points at the host paths and breaks the build.
      - cd mobile && rm -rf build
      - cd mobile && flutter pub get
      - cd mobile && flutter build linux --release
      # Install the bundle preserving its internal layout: the Flutter Linux
      # runner resolves "data/" and "lib/" relative to the executable.
      - mkdir -p /app/bin /app/lib/karter
      - cp -a mobile/build/linux/x64/release/bundle/. /app/lib/karter/
      # Strip debug/unneeded symbols from native libraries to shrink the export.
      - find /app/lib/karter/lib -type f -name '*.so*' -exec strip --strip-unneeded {} + || true
      - strip --strip-unneeded /app/lib/karter/karter || true
      - printf '#!/bin/sh\nexec /app/lib/karter/karter "$@"\n' > /app/bin/karter
      - chmod +x /app/bin/karter
      - install -Dm644 dev.abrah.karter.desktop /app/share/applications/dev.abrah.karter.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/dev.abrah.karter.png
    sources:
      # Replicate the repository layout so mobile/templates and mobile/i18n
      # symlinks resolve against the real ../templates tree.
      - type: dir
        path: ../mobile
        dest: mobile
      - type: dir
        path: ../templates
        dest: templates
      - type: file
        path: dev.abrah.karter.desktop
      - type: file
        path: icons/256.png
        dest-filename: icon.png
