name: mobile
description: "Karter - Open source vehicle maintenance tracker"
publish_to: 'none'
version: 2026.07.13+17

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  material3_indicators: ^2026.7.12+2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.1.2
  system_theme: ^3.3.0
  shared_preferences: ^2.5.5
  pdf: ^3.10.0
  printing: ^5.11.0
  flutter_local_notifications: ^22.0.1
  workmanager: ^0.9.0+3
  animations: ^2.0.11
  http: ^1.2.0
  in_app_review: ^2.0.9
  flutter_colorpicker: ^1.1.0
  package_info_plus: ^10.2.1
  sensors_plus: ^7.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.0
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/karter-icon-1024.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/branding/karter-icon-1024.png"
  adaptive_icon_foreground_inset: 8
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - templates/
    - i18n/
    - CHANGELOG.md
